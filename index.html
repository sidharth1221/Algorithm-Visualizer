<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Algorithm Visualizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --bar-default: #94a3b8;
            --bar-active: #ef4444;
            --bar-sorted: #10b981;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text-color);
        }

        .controls-panel {
            background-color: var(--panel-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 900px;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: center;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #cbd5e1;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 0.95rem;
        }

        button:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
            opacity: 0.7;
        }

        select {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            font-size: 0.95rem;
        }

        select:focus {
            border-color: var(--primary-color);
        }

        input[type="range"] {
            accent-color: var(--primary-color);
            width: 150px;
            cursor: pointer;
        }

        .visualizer-container {
            width: 100%;
            max-width: 1000px;
            height: 400px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 2px;
            padding: 0 1rem;
        }

        .array-bar {
            background-color: var(--bar-default);
            width: 100%;
            border-radius: 4px 4px 0 0;
            transition: background-color 0.1s;
        }

        .array-bar.active {
            background-color: var(--bar-active);
        }

        .array-bar.sorted {
            background-color: var(--bar-sorted);
        }

        .legend {
            display: flex;
            gap: 1.5rem;
            margin-top: 2rem;
            font-size: 0.875rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .color-box {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sorting Algorithm Visualizer</h1>
    </header>

    <div class="controls-panel">
        <div class="controls-row">
            <button id="generate-btn" onclick="generateNewArray()">Generate New Array</button>

            <div class="control-group">
                <label for="array-size">Array Size: <span id="size-val">40</span></label>
                <input type="range" id="array-size" min="10" max="150" value="40" oninput="updateSize()">
            </div>

            <div class="control-group">
                <label for="speed">Animation Speed</label>
                <input type="range" id="speed" min="1" max="100" value="50">
            </div>
        </div>

        <div class="controls-row">
            <div class="control-group">
                <select id="algorithm">
                    <option value="bubbleSort">Bubble Sort</option>
                    <option value="mergeSort">Merge Sort</option>
                    <option value="insertionSort">Insertion Sort</option>
                    <option value="quickSort">Quick Sort</option>
                    <option value="selectionSort">Selection Sort</option>
                    <option value="heapSort">Heap Sort</option>
                    <option value="shellSort">Shell Sort</option>
                    <option value="cocktailSort">Cocktail Sort</option>
                    <option value="radixSort">Radix Sort</option>
                    <option value="cycleSort">Cycle Sort</option>
                    <option value="combSort">Comb Sort</option>
                    <option value="gnomeSort">Gnome Sort</option>
                </select>
            </div>

            <div class="control-group">
                <select id="order">
                    <option value="ascending">Ascending</option>
                    <option value="descending">Descending</option>
                </select>
            </div>

            <button id="sort-btn" onclick="startSort()">Visualize</button>
        </div>
    </div>

    <div class="visualizer-container" id="array-container"></div>

    <div class="legend">
        <div class="legend-item">
            <div class="color-box" style="background-color: var(--bar-default);"></div>
            <span>Unsorted</span>
        </div>
        <div class="legend-item">
            <div class="color-box" style="background-color: var(--bar-active);"></div>
            <span>Active / Comparing</span>
        </div>
        <div class="legend-item">
            <div class="color-box" style="background-color: var(--bar-sorted);"></div>
            <span>Sorted</span>
        </div>
    </div>

    <script>
        let array = [];
        let isSorting = false;
        let order = 'ascending';
        
        const container = document.getElementById('array-container');

        function updateSize() {
            if (isSorting) return;
            const size = document.getElementById('array-size').value;
            document.getElementById('size-val').textContent = size;
            generateNewArray();
        }

        function generateNewArray() {
            if (isSorting) return;
            const size = document.getElementById('array-size').value;
            array = Array.from({ length: size }, () => Math.floor(Math.random() * 100) + 1);
            createBars(array);
        }

        function createBars(arr) {
            container.innerHTML = '';
            const maxElement = Math.max(...arr);
            
            arr.forEach((value) => {
                const bar = document.createElement('div');
                bar.classList.add('array-bar');
                const height = (value / maxElement) * 100;
                bar.style.height = `${height}%`;
                container.appendChild(bar);
            });
        }

        function getDelay() {
            const speedSlider = document.getElementById('speed').value;
            // 1 to 100 mapped to roughly 1000ms down to 2ms
            return Math.floor(1000 / Math.pow(speedSlider, 1.2));
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function toggleControls(disabled) {
            document.getElementById('generate-btn').disabled = disabled;
            document.getElementById('array-size').disabled = disabled;
            document.getElementById('sort-btn').disabled = disabled;
            document.getElementById('algorithm').disabled = disabled;
            document.getElementById('order').disabled = disabled;
        }

        async function updateBarHeights() {
            const bars = document.getElementsByClassName('array-bar');
            const maxElement = Math.max(...array);
            for (let i = 0; i < array.length; i++) {
                const height = (array[i] / maxElement) * 100;
                bars[i].style.height = `${height}%`;
            }
        }

        // --- ALGORITHMS ---

        async function bubbleSort() {
            const bars = document.getElementsByClassName('array-bar');
            for (let i = 0; i < array.length - 1; i++) {
                for (let j = 0; j < array.length - i - 1; j++) {
                    if (!isSorting) return;
                    bars[j].classList.add('active');
                    bars[j + 1].classList.add('active');
                    await sleep(getDelay());
                    if (
                        (order === 'ascending' && array[j] > array[j + 1]) ||
                        (order === 'descending' && array[j] < array[j + 1])
                    ) {
                        [array[j], array[j + 1]] = [array[j + 1], array[j]];
                        updateBarHeights();
                    }
                    bars[j].classList.remove('active');
                    bars[j + 1].classList.remove('active');
                }
                bars[array.length - 1 - i].classList.add('sorted');
            }
            if(isSorting) bars[0].classList.add('sorted');
        }

        async function insertionSort() {
            const bars = document.getElementsByClassName('array-bar');
            if(isSorting) bars[0].classList.add('sorted');
            for (let i = 1; i < array.length; i++) {
                if (!isSorting) return;
                let key = array[i];
                let j = i - 1;
                bars[i].classList.add('active');
                await sleep(getDelay());
                
                while (j >= 0 && 
                       ((order === 'ascending' && array[j] > key) || 
                        (order === 'descending' && array[j] < key))) {
                    if (!isSorting) return;
                    bars[j].classList.add('active');
                    await sleep(getDelay());
                    array[j + 1] = array[j];
                    updateBarHeights();
                    bars[j].classList.remove('active');
                    j--;
                }
                array[j + 1] = key;
                updateBarHeights();
                bars[i].classList.remove('active');
                
                for (let k = 0; k <= i; k++) {
                    bars[k].classList.add('sorted');
                }
            }
        }

        async function mergeSort() {
            const auxArray = [...array];
            
            async function mergeSortHelper(left, right) {
                if (left < right) {
                    const mid = Math.floor((left + right) / 2);
                    await mergeSortHelper(left, mid);
                    await mergeSortHelper(mid + 1, right);
                    await merge(left, mid, right);
                }
            }
            
            async function merge(left, mid, right) {
                if (!isSorting) return;
                const bars = document.getElementsByClassName('array-bar');
                
                for (let i = left; i <= right; i++) {
                    if (!isSorting) return;
                    bars[i].classList.add('active');
                }
                await sleep(getDelay());
                
                for (let i = left; i <= right; i++) {
                    auxArray[i] = array[i];
                }
                
                let i = left, j = mid + 1, k = left;
                
                while (i <= mid && j <= right) {
                    if (!isSorting) return;
                    if (
                        (order === 'ascending' && auxArray[i] <= auxArray[j]) ||
                        (order === 'descending' && auxArray[i] >= auxArray[j])
                    ) {
                        array[k] = auxArray[i];
                        i++;
                    } else {
                        array[k] = auxArray[j];
                        j++;
                    }
                    updateBarHeights();
                    k++;
                    await sleep(getDelay());
                }
                
                while (i <= mid) {
                    if (!isSorting) return;
                    array[k] = auxArray[i];
                    updateBarHeights();
                    i++;
                    k++;
                    await sleep(getDelay());
                }
                
                for (let i = left; i <= right; i++) {
                    bars[i].classList.remove('active');
                    bars[i].classList.add('sorted');
                }
            }
            
            if (isSorting) {
                await mergeSortHelper(0, array.length - 1);
            }
        }

        async function quickSort() {
            async function quickSortHelper(low, high) {
                if (low < high) {
                    if (!isSorting) return;
                    const pi = await partition(low, high);
                    await quickSortHelper(low, pi - 1);
                    await quickSortHelper(pi + 1, high);
                } else if(low === high && isSorting) {
                    const bars = document.getElementsByClassName('array-bar');
                    bars[low].classList.add('sorted');
                }
            }
            
            async function partition(low, high) {
                if (!isSorting) return;
                const bars = document.getElementsByClassName('array-bar');
                const pivot = array[high];
                bars[high].classList.add('active');
                
                let i = low - 1;
                
                for (let j = low; j < high; j++) {
                    if (!isSorting) return;
                    bars[j].classList.add('active');
                    await sleep(getDelay());
                    
                    if (
                        (order === 'ascending' && array[j] < pivot) ||
                        (order === 'descending' && array[j] > pivot)
                    ) {
                        i++;
                        [array[i], array[j]] = [array[j], array[i]];
                        updateBarHeights();
                    }
                    bars[j].classList.remove('active');
                }
                
                [array[i + 1], array[high]] = [array[high], array[i + 1]];
                updateBarHeights();
                bars[high].classList.remove('active');
                
                bars[i + 1].classList.add('sorted');
                return i + 1;
            }
            
            await quickSortHelper(0, array.length - 1);
            if(isSorting) {
                const bars = document.getElementsByClassName('array-bar');
                for (let i = 0; i < array.length; i++) bars[i].classList.add('sorted');
            }
        }
        
        async function selectionSort() {
            const bars = document.getElementsByClassName('array-bar');
            for (let i = 0; i < array.length - 1; i++) {
                if (!isSorting) return;
                let minIdx = i;
                bars[i].classList.add('active');
                
                for (let j = i + 1; j < array.length; j++) {
                    if (!isSorting) return;
                    bars[j].classList.add('active');
                    await sleep(getDelay());
                    
                    if (
                        (order === 'ascending' && array[j] < array[minIdx]) ||
                        (order === 'descending' && array[j] > array[minIdx])
                    ) {
                        if (minIdx !== i) bars[minIdx].classList.remove('active');
                        minIdx = j;
                    } else {
                        bars[j].classList.remove('active');
                    }
                }
                
                if (minIdx !== i) {
                    [array[i], array[minIdx]] = [array[minIdx], array[i]];
                    updateBarHeights();
                    bars[minIdx].classList.remove('active');
                }
                
                bars[i].classList.remove('active');
                bars[i].classList.add('sorted');
            }
            if(isSorting) bars[array.length - 1].classList.add('sorted');
        }
        
        async function heapSort() {
            const bars = document.getElementsByClassName('array-bar');
            
            async function heapify(n, i) {
                if (!isSorting) return;
                let largest = i;
                let left = 2 * i + 1;
                let right = 2 * i + 2;
                
                if (left < n && ((order === 'ascending' && array[left] > array[largest]) || (order === 'descending' && array[left] < array[largest]))) largest = left;
                if (right < n && ((order === 'ascending' && array[right] > array[largest]) || (order === 'descending' && array[right] < array[largest]))) largest = right;
                
                if (largest !== i) {
                    bars[i].classList.add('active');
                    bars[largest].classList.add('active');
                    await sleep(getDelay());
                    
                    [array[i], array[largest]] = [array[largest], array[i]];
                    updateBarHeights();
                    
                    bars[i].classList.remove('active');
                    bars[largest].classList.remove('active');
                    
                    await heapify(n, largest);
                }
            }
            
            const n = array.length;
            for (let i = Math.floor(n / 2) - 1; i >= 0; i--) {
                if (!isSorting) return;
                await heapify(n, i);
            }
            
            for (let i = n - 1; i > 0; i--) {
                if (!isSorting) return;
                bars[0].classList.add('active');
                bars[i].classList.add('active');
                await sleep(getDelay());
                
                [array[0], array[i]] = [array[i], array[0]];
                updateBarHeights();
                
                bars[0].classList.remove('active');
                bars[i].classList.remove('active');
                
                bars[i].classList.add('sorted');
                await heapify(i, 0);
            }
            if(isSorting) bars[0].classList.add('sorted');
        }

        async function shellSort() {
            const bars = document.getElementsByClassName('array-bar');
            let n = array.length;

            for (let gap = Math.floor(n / 2); gap > 0; gap = Math.floor(gap / 2)) {
                for (let i = gap; i < n; i++) {
                    if (!isSorting) return;
                    let temp = array[i];
                    let j = i;

                    bars[i].classList.add('active');
                    await sleep(getDelay());

                    while (j >= gap && 
                           ((order === 'ascending' && array[j - gap] > temp) || 
                            (order === 'descending' && array[j - gap] < temp))) {
                        if (!isSorting) return;
                        bars[j].classList.add('active');
                        bars[j - gap].classList.add('active');
                        await sleep(getDelay());

                        array[j] = array[j - gap];
                        updateBarHeights();

                        bars[j].classList.remove('active');
                        bars[j - gap].classList.remove('active');

                        j -= gap;
                    }
                    array[j] = temp;
                    updateBarHeights();
                    bars[i].classList.remove('active');
                }
            }
            if (isSorting) {
                for (let i = 0; i < n; i++) bars[i].classList.add('sorted');
            }
        }

        async function cocktailSort() {
            const bars = document.getElementsByClassName('array-bar');
            let swapped = true;
            let start = 0;
            let end = array.length - 1;

            while (swapped && isSorting) {
                swapped = false;
                for (let i = start; i < end; i++) {
                    if (!isSorting) return;
                    bars[i].classList.add('active');
                    bars[i + 1].classList.add('active');
                    await sleep(getDelay());

                    if (
                        (order === 'ascending' && array[i] > array[i + 1]) ||
                        (order === 'descending' && array[i] < array[i + 1])
                    ) {
                        [array[i], array[i + 1]] = [array[i + 1], array[i]];
                        updateBarHeights();
                        swapped = true;
                    }
                    bars[i].classList.remove('active');
                    bars[i + 1].classList.remove('active');
                }
                if (!swapped) break;
                if(isSorting) bars[end].classList.add('sorted');
                end--;

                for (let i = end; i > start; i--) {
                    if (!isSorting) return;
                    bars[i].classList.add('active');
                    bars[i - 1].classList.add('active');
                    await sleep(getDelay());

                    if (
                        (order === 'ascending' && array[i - 1] > array[i]) ||
                        (order === 'descending' && array[i - 1] < array[i])
                    ) {
                        [array[i - 1], array[i]] = [array[i], array[i - 1]];
                        updateBarHeights();
                        swapped = true;
                    }
                    bars[i].classList.remove('active');
                    bars[i - 1].classList.remove('active');
                }
                if(isSorting) bars[start].classList.add('sorted');
                start++;
            }
            if (isSorting) {
                for (let i = 0; i < array.length; i++) bars[i].classList.add('sorted');
            }
        }

        async function radixSort() {
            const bars = document.getElementsByClassName('array-bar');
            const maxNum = Math.max(...array);
            let divisor = 1;

            while (divisor <= maxNum && isSorting) {
                let buckets = Array.from({ length: 10 }, () => []);

                for (let i = 0; i < array.length; i++) {
                    if (!isSorting) return;
                    const digit = Math.floor((array[i] / divisor) % 10);
                    buckets[digit].push(array[i]);
                    bars[i].classList.add('active');
                    await sleep(getDelay());
                    bars[i].classList.remove('active');
                }

                let index = 0;
                // If descending, process buckets in reverse order
                const bucketIter = order === 'ascending' ? buckets : buckets.slice().reverse();
                for (let i = 0; i < 10; i++) {
                    for (let j = 0; j < bucketIter[i].length; j++) {
                        if (!isSorting) return;
                        array[index] = bucketIter[i][j];
                        updateBarHeights();
                        bars[index].classList.add('active');
                        await sleep(getDelay());
                        bars[index].classList.remove('active');
                        index++;
                    }
                }
                divisor *= 10;
            }
            if (isSorting) {
                for(let i=0; i<array.length; i++) bars[i].classList.add('sorted');
            }
        }

        async function cycleSort() {
            const bars = document.getElementsByClassName('array-bar');
            const n = array.length;

            for (let cycleStart = 0; cycleStart < n - 1; cycleStart++) {
                if (!isSorting) return;
                let item = array[cycleStart];
                let pos = cycleStart;

                for (let i = cycleStart + 1; i < n; i++) {
                    if (!isSorting) return;
                    if ((order === 'ascending' && array[i] < item) || (order === 'descending' && array[i] > item)) pos++;
                }

                if (pos === cycleStart) continue;

                while ((order === 'ascending' && item === array[pos]) || (order === 'descending' && item === array[pos])) pos++;

                if (pos !== cycleStart) {
                    bars[cycleStart].classList.add('active');
                    bars[pos].classList.add('active');
                    await sleep(getDelay());

                    [array[pos], item] = [item, array[pos]];
                    updateBarHeights();

                    bars[cycleStart].classList.remove('active');
                    bars[pos].classList.remove('active');
                }

                while (pos !== cycleStart) {
                    if (!isSorting) return;
                    pos = cycleStart;
                    for (let i = cycleStart + 1; i < n; i++) {
                        if (!isSorting) return;
                        if ((order === 'ascending' && array[i] < item) || (order === 'descending' && array[i] > item)) pos++;
                    }
                    while ((order === 'ascending' && item === array[pos]) || (order === 'descending' && item === array[pos])) pos++;

                    bars[pos].classList.add('active');
                    bars[cycleStart].classList.add('active');
                    await sleep(getDelay());

                    [array[pos], item] = [item, array[pos]];
                    updateBarHeights();

                    bars[pos].classList.remove('active');
                    bars[cycleStart].classList.remove('active');
                }
            }
            if (isSorting) {
                for (let i = 0; i < array.length; i++) bars[i].classList.add('sorted');
            }
        }

        async function combSort() {
            const bars = document.getElementsByClassName('array-bar');
            const n = array.length;
            let gap = n;
            let swapped = true;

            while (gap !== 1 || swapped) {
                if (!isSorting) return;
                gap = Math.floor((gap * 10) / 13);
                if (gap < 1) gap = 1;
                swapped = false;

                for (let i = 0; i < n - gap; i++) {
                    if (!isSorting) return;
                    bars[i].classList.add('active');
                    bars[i + gap].classList.add('active');
                    await sleep(getDelay());

                    if (
                        (order === 'ascending' && array[i] > array[i + gap]) ||
                        (order === 'descending' && array[i] < array[i + gap])
                    ) {
                        [array[i], array[i + gap]] = [array[i + gap], array[i]];
                        updateBarHeights();
                        swapped = true;
                    }

                    bars[i].classList.remove('active');
                    bars[i + gap].classList.remove('active');
                }
            }
            if (isSorting) {
                for (let i = 0; i < array.length; i++) bars[i].classList.add('sorted');
            }
        }

        async function gnomeSort() {
            const bars = document.getElementsByClassName('array-bar');
            let index = 0;
            const n = array.length;

            while (index < n) {
                if (!isSorting) return;
                if (index === 0) {
                    index++;
                }
                
                bars[index].classList.add('active');
                bars[index - 1].classList.add('active');
                await sleep(getDelay());

                if (
                    (order === 'ascending' && array[index] >= array[index - 1]) ||
                    (order === 'descending' && array[index] <= array[index - 1])
                ) {
                    bars[index].classList.remove('active');
                    bars[index - 1].classList.remove('active');
                    index++;
                } else {
                    [array[index], array[index - 1]] = [array[index - 1], array[index]];
                    updateBarHeights();
                    bars[index].classList.remove('active');
                    bars[index - 1].classList.remove('active');
                    index--;
                }
            }
            if (isSorting) {
                for (let i = 0; i < array.length; i++) bars[i].classList.add('sorted');
            }
        }

        async function startSort() {
            if (isSorting) return;
            isSorting = true;

            toggleControls(true);

            const bars = document.getElementsByClassName('array-bar');
            for (let bar of bars) {
                bar.classList.remove('sorted');
                bar.classList.remove('active');
            }

            const algorithm = document.getElementById('algorithm').value;
            order = document.getElementById('order').value;

            try {
                switch (algorithm) {
                    case 'bubbleSort': await bubbleSort(); break;
                    case 'mergeSort': await mergeSort(); break;
                    case 'insertionSort': await insertionSort(); break;
                    case 'quickSort': await quickSort(); break;
                    case 'selectionSort': await selectionSort(); break;
                    case 'heapSort': await heapSort(); break;
                    case 'shellSort': await shellSort(); break;
                    case 'cocktailSort': await cocktailSort(); break;
                    case 'radixSort': await radixSort(); break;
                    case 'cycleSort': await cycleSort(); break;
                    case 'combSort': await combSort(); break;
                    case 'gnomeSort': await gnomeSort(); break;
                }
            } finally {
                isSorting = false;
                toggleControls(false);
            }
        }

        // Initialize
        generateNewArray();
    </script>
</body>
</html>
